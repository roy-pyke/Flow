name: Verify Flow
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - run: pip install -r requirements.lock.txt
      - name: Verify the pure Python installation
        run: python -m pytest -q
      - name: Compile the C++17 extension from source
        run: python -m pip install ./cpp
      - name: Require and exercise the native backend
        run: FLOW_REQUIRE_NATIVE=1 python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci && npm run build && npm run lint
        working-directory: frontend
