[build-system]
requires = ["scikit-build-core==1.0.3", "pybind11==3.1.0"]
build-backend = "scikit_build_core.build"

[project]
name = "flow-cpp"
version = "0.2.0"
description = "Single-threaded double-precision diffusion kernels for Flow"
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = []
sdist.include = ["CMakeLists.txt", "source_hash.py", "src/**"]
